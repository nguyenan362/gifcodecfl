<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giftcode CFL</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      :root {
        --bg-main: #f2f7f3;
        --text-main: #1b2a22;
        --border-soft: #d7e4da;
      }

      body {
        font-family: "IBM Plex Sans", "Segoe UI", Tahoma, sans-serif;
        color: var(--text-main);
        background: var(--bg-main);
        min-height: 100vh;
      }

      .hero {
        border-bottom: 1px solid var(--border-soft);
      }

      .shell-card {
        border: 1px solid var(--border-soft);
        border-radius: 1rem;
        box-shadow: 0 1rem 2.25rem rgba(27, 58, 40, 0.08);
        overflow: hidden;
      }

      .mono {
        font-family: "IBM Plex Mono", "Consolas", monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }

      #codes {
        min-height: 170px;
      }

      #status {
        min-height: 46px;
      }

      @media (max-width: 576px) {
        body {
          padding-top: 0.5rem;
          padding-bottom: 1rem;
        }
      }
    </style>
  </head>
  <body class="py-4">
    <main class="container-lg">
      <div class="card shell-card">
        <section class="hero p-4 p-md-5">
          <h1 class="h3 fw-bold mb-2">Nhận Gift Code CFL</h1>
          <p class="text-secondary mb-0">
            Nhập ID nhân vật và danh sách gift code.
          </p>
        </section>

        <div class="card-body p-4 p-md-5">
          <form id="redeemForm" class="row g-3">
            <div class="col-12">
              <label for="userID" class="form-label fw-semibold">ID nhân vật</label>
              <input
                id="userID"
                name="userID"
                type="text"
                class="form-control"
                placeholder="Ví dụ: 123456789"
                required
              />
            </div>

            <div class="col-12">
              <label for="codes" class="form-label fw-semibold">Danh sách gift code</label>
              <textarea
                id="codes"
                name="codes"
                class="form-control"
                placeholder="Nhập nhiều code, mỗi dòng một code&#10;VD: CODE1&#10;CODE2&#10;CODE3"
                required
              ></textarea>
              <div class="form-text">Hỗ trợ nhiều dòng, dấu phẩy và tự bỏ code trùng lặp.</div>
            </div>

            <div class="col-12 d-flex flex-wrap gap-2">
              <button id="submitBtn" type="submit" class="btn btn-success">Gửi nhận thưởng</button>
              <button id="clearBtn" type="button" class="btn btn-outline-secondary">Xóa kết quả</button>
            </div>

            <div class="col-12">
              <div id="status"></div>
            </div>
          </form>
        </div>

        <section class="card-footer bg-white border-0 px-4 px-md-5 pb-4 pb-md-5">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Code</th>
                  <th>Trạng thái</th>
                </tr>
              </thead>
              <tbody id="resultsBody">
                <tr>
                  <td colspan="2" class="text-secondary">Chưa có dữ liệu.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <script>
      const form = document.getElementById("redeemForm");
      const userInput = document.getElementById("userID");
      const codesInput = document.getElementById("codes");
      const statusEl = document.getElementById("status");
      const resultsBody = document.getElementById("resultsBody");
      const submitBtn = document.getElementById("submitBtn");
      const clearBtn = document.getElementById("clearBtn");

      function setStatus(message, isError = false) {
        if (!message) {
          statusEl.innerHTML = "";
          return;
        }

        const alertClass = isError ? "alert-danger" : "alert-secondary";
        statusEl.innerHTML = `<div class="alert ${alertClass} py-2 mb-0" role="alert">${escapeHtml(message)}</div>`;
      }

      function renderResults(results) {
        if (!Array.isArray(results) || results.length === 0) {
          resultsBody.innerHTML = '<tr><td colspan="2" class="text-secondary">Không có kết quả.</td></tr>';
          return;
        }

        resultsBody.innerHTML = results
          .map((item) => {
            const isSuccess = item.status === "success" || item.success === true;
            const statusClass = isSuccess ? "text-bg-success" : "text-bg-danger";
            const statusText = isSuccess ? "Thành công" : "Lỗi";

            return `
              <tr>
                <td class="mono">${escapeHtml(item.code ?? "")}</td>
                <td><span class="badge ${statusClass}">${statusText}</span></td>
              </tr>
            `;
          })
          .join("");
      }

      function escapeHtml(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const userID = userInput.value.trim();
        const codes = codesInput.value.trim();

        if (!userID || !codes) {
          setStatus("Vui lòng nhập đầy đủ ID nhân vật và gift code.", true);
          return;
        }

        submitBtn.disabled = true;
        setStatus("Đang gửi yêu cầu nhận thưởng...");

        try {
          const response = await fetch("/api/redeem", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ userID, codes }),
          });

          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            setStatus(data.error || `Lỗi ${response.status}. Không thể xử lý yêu cầu.`, true);
            return;
          }

          renderResults(data.results);
          setStatus(`Đã xử lý ${data.results?.length || 0} gift code.`);
        } catch (error) {
          setStatus(`Không thể kết nối server: ${error.message}`, true);
        } finally {
          submitBtn.disabled = false;
        }
      });

      clearBtn.addEventListener("click", () => {
        resultsBody.innerHTML = '<tr><td colspan="2" class="text-secondary">Chưa có dữ liệu.</td></tr>';
        setStatus("");
      });
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
